<!-- Using the given WebGL template, draw the shape shown in the reference image. The drawing consists of an outlined
triangle positioned above a filled rectangle, forming a house-like structure. Set the canvas color as (0.88, 0.55, 0.65,
1.0). Set the primitive color as (0.8, 0.8, 0.8, 1.0). Use appropriate WebGL primitives and Maintain the relative
positions, sizes, and alignment of the shapes as shown in the reference image -->



<!DOCTYPE html>
<html>
<head>
    <title>Lab Test 1:</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
<canvas id="webglcanvas" width="500" height="500"></canvas>

<script>

    var canvas = document.getElementById("webglcanvas");
    var gl = canvas.getContext("webgl");
    gl.clearColor(0.88, 0.55, 0.65, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    ////write vertex shader code

    var vertexShaderSource = `
      attribute vec3 a_coords;
      void main(){
      gl_Position = vec4(a_coords,1.0);
      }
      `;
    ////write fragment shader code

    var fragmentShaderSource = `
      void main(){
      gl_FragColor = vec4(0.8, 0.8, 0.8, 1.0);
      }
      `;


    var vsh = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vsh, vertexShaderSource);
    gl.compileShader(vsh);

    var fsh = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fsh, fragmentShaderSource);
    gl.compileShader(fsh);

    var prog = gl.createProgram();

    gl.attachShader(prog, vsh);
    gl.attachShader(prog, fsh);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    var a_coords_location = gl.getAttribLocation(prog, "a_coords");

    ////enter vertext data here
    var coords = new Float32Array([
        -0.7,-0.4,0.0,
        0.7,-0.4,0.0,
        -0.7,0.2,0.0,

        -0.7,0.2,0.0,
        0.7,-0.4,0.0,
        0.7,0.2,0.0,

        -0.7,0.3,0.0,
        0.7,0.3,0.0,
        0.0,0.6,0.0
    ]);

    var a_coords_buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, a_coords_buffer);
    gl.bufferData(gl.ARRAY_BUFFER, coords, gl.STATIC_DRAW);
    gl.vertexAttribPointer(a_coords_location, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(a_coords_location);

    ////write exact primitives

    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.drawArrays(gl.LINE_LOOP, 6, 3);
</script>
</body>
</html>
