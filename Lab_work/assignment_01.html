<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 1</title>
    <canvas id="drawFish" width="500" height="500" ></canvas>
    <style>
        body{
            align-items: center;
            justify-content: center;
            display: flex;
            height: 100vh;
            margin: 0;
        }
    </style>
  </head>
  <body>
    <script>
      var canvas = document.getElementById("drawFish");
      var gl = canvas.getContext("webgl");

      gl.clearColor(0.71, 0.90, 0.94, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      var vertexShaderSource = `
              attribute vec3 acoords;
              void main() {
                  gl_Position = vec4(acoords,1.0);
      }`;

      var fragmentShaderSource = `
            void main() {
                gl_FragColor = vec4(0.05, 0.29, 0.34, 1.0);
      }`;

      var vsh = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vsh, vertexShaderSource);
      gl.compileShader(vsh);

      var fsh = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fsh, fragmentShaderSource);
      gl.compileShader(fsh);

      var prog = gl.createProgram();
      gl.attachShader(prog, vsh);
      gl.attachShader(prog, fsh);
      gl.linkProgram(prog);
      gl.useProgram(prog);

      var acoords_location = gl.getAttribLocation(prog, "acoords");

      var coords = new Float32Array([
        // Fish body
        -0.7, 0.0, 0.0,
        -0.03, -0.4, 0.0, 
        -0.03, 0.45, 0.0, 
        // Fish Body
        0.6, 0.0, 0.0, 
        0.0,-0.4, 0.0, 
        0.0, 0.45, 0.0, 
        // Fish Tail
        0.62, 0.0, 0.0, 
        0.83, 0.3, 0.0, 
        0.83, -0.3, 0.0, 
        // Fish fins
        -0.2, 0.47, 0.0, 
        0.18, 0.47, 0.0, 
        -0.04, 0.63, 0.0, 
        // Fish fins
        -0.2, -0.42, 0.0,
        0.18, -0.42, 0.0, 
        -0.04, -0.61, 0.0
      ]);

      var buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, coords, gl.STATIC_DRAW);

      gl.enableVertexAttribArray(acoords_location);
      gl.vertexAttribPointer(acoords_location, 3, gl.FLOAT, false, 0, 0);     
      gl.drawArrays(gl.TRIANGLES, 0, 15);
    </script>
  </body>
</html>
