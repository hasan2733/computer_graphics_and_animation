<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%237bdcff' text-anchor='middle' x='50'%3EA%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; display: flex; justify-content: center; align-items: center; font-family: Inter, "Segoe UI", sans-serif; color: #fff; background: #f0f0f0; }
      .canvas-container {
        position: relative;
        width: 800px;
        height: 600px;
      }
      .text { text-align: center; color: #333; font-family: Arial, sans-serif; }
      footer { text-align: center; color: #333; font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div class="text">
      <h4>Click on the canvas to move the triangle to the right. When it reaches
        the edge, it will wrap around to the left.</h4>
    </div>

    <div class="canvas-container">
      <canvas id="moving_triangle" width="800" height="600"></canvas>
      <script>
        var canvas = document.getElementById("moving_triangle");
        var gl = canvas.getContext("webgl");

        if (!gl) {
          throw new Error("WebGL is not supported by this browser.");
        }

        var vertexShaderSource = `
            attribute vec3 a_coords;
            uniform float u_shift;
            void main() {
              gl_Position = vec4(a_coords.x + u_shift, a_coords.y , a_coords.z, 1.0);
            }
        `;

        var fragmentShaderSource = `
            precision mediump float;
            uniform vec3 u_color;
            void main() {
              gl_FragColor = vec4(u_color, 1.0);
            }
        `;

        var vsh = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsh, vertexShaderSource);
        gl.compileShader(vsh);

        var fsh = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsh, fragmentShaderSource);
        gl.compileShader(fsh);

        var prog = gl.createProgram();
        gl.attachShader(prog, vsh);
        gl.attachShader(prog, fsh);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(prog));
        }
        gl.useProgram(prog);

        var a_coords_location = gl.getAttribLocation(prog, "a_coords");
        var u_shift_location = gl.getUniformLocation(prog, "u_shift");
        var u_color_location = gl.getUniformLocation(prog, "u_color");

        var coords = new Float32Array([
          -0.7, 0.0, 0.0,
          -0.03, -0.4, 0.0,
          -0.03, 0.45, 0.0,
          0.6, 0.0, 0.0,
          0.0,-0.4, 0.0,
          0.0,0.45, 0.0,
          0.62, 0.0, 0.0,
          0.83, 0.3, 0.0,
          0.83, -0.3, 0.0,
          -0.2, 0.47, 0.0,
          0.18, 0.47, 0.0,
          -0.04, 0.63, 0.0,
          -0.2, -0.42, 0.0,
          0.18, -0.42, 0.0,
          -0.04, -0.61, 0.0
        ]);

        var buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, coords, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(a_coords_location);
        gl.vertexAttribPointer(a_coords_location, 3, gl.FLOAT, false, 0, 0);

        var color = new Float32Array([0.8, 0.2, 0.2]);
        gl.uniform3fv(u_color_location, color);

        var shift = 0.0;
        gl.uniform1f(u_shift_location, shift);

        gl.clearColor(0.88, 0.55, 0.65, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        canvas.onmousedown = function () {
          shift += 0.1;
          if (shift > 1.5) {
            shift = -1.5;
          }
          gl.uniform1f(u_shift_location, shift);
          gl.clearColor(0.88, 0.55, 0.65, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
      </script>
    </div>
    <footer>
      <p style="text-align: center; margin-top: 20px">
        <a href="https://github.com/hasan2733/computer_graphics_and_animation" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: #333">GitHub</a>
        &copy; 2026
      </p>
    </footer>
  </body>
</html>
<body>
    <script>
        var canvas = document.getElementById("lab_01");
        var gl = canvas.getContext("webgl");
        gl.clearColor(1.0, 0.75, 0.75, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        var vertexShaderSource = `
            attribute vec3 acoords;
            void main() {
                gl_Position = vec4(acoords, 1.0);
            }
        `;

        var fragementShaderSource = `
            void main() {
                gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
            }
        `;

        var vsh = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsh, vertexShaderSource);
        gl.compileShader(vsh);

        var fsh = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsh, fragementShaderSource);
        gl.compileShader(fsh);

        var prog = gl.createProgram();
        gl.attachShader(prog, vsh);
        gl.attachShader(prog, fsh);
        gl.linkProgram(prog);
        gl.useProgram(prog);

        var acoords_location = gl.getAttribLocation(prog, "acoords");

        var coords = new Float32Array([
            0.0, 0.0, 0.0,
            0.0, 0.5, 0.0,
            0.5, 0.0, 0.0
        ]);

        var buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, coords, gl.STATIC_DRAW);

        gl.enableVertexAttribArray(acoords_location);
        gl.vertexAttribPointer(acoords_location, 3, gl.FLOAT, false, 0, 0);

        gl.drawArrays(gl.TRIANGLES, 0, 3);

    </script>
</body>
</html>
