    <style>

  <body>
    <div class="text">
      Click on the canvas to move the triangle to the right. When it reaches
        the edge, it will wrap around to the left.
    </div>

    <div class="canvas-container">
      <canvas id="moving_triangle" width="800" height="600"></canvas>
      <script>
        var canvas = document.getElementById("moving_triangle");
        var gl = canvas.getContext("webgl");

        if (!gl) {
          throw new Error("WebGL is not supported by this browser.");
        }

        var vertexShaderSource = `
            attribute vec3 a_coords;
            uniform float u_shift;
            void main() {
              gl_Position = vec4(a_coords.x + u_shift, a_coords.y , a_coords.z, 1.0);
            }
        `;

        var fragmentShaderSource = `
            precision mediump float;
            uniform vec3 u_color;
            void main() {
              gl_FragColor = vec4(u_color, 1.0);
            }
        `;

        var vsh = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsh, vertexShaderSource);
        gl.compileShader(vsh);

        var fsh = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsh, fragmentShaderSource);
        gl.compileShader(fsh);

        var prog = gl.createProgram();
        gl.attachShader(prog, vsh);
        gl.attachShader(prog, fsh);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(prog));
        }
        gl.useProgram(prog);

        var a_coords_location = gl.getAttribLocation(prog, "a_coords");
        var u_shift_location = gl.getUniformLocation(prog, "u_shift");
        var u_color_location = gl.getUniformLocation(prog, "u_color");

        var coords = new Float32Array([
          -0.5, -0.5, 0.0,
          0.5, -0.5, 0.0,
          -0.5, 0.0, 0.0,
          0.6, 0.0, 0.0,
          0.0,-0.5, 0.0,
          0.0,0.5, 0.0,
          -0.5,0.2, 0.0,
          0.5,0.2, 0.0,
          0.0,-0.5, 0.0,
          0.0,0.5, 0.0,
          -0.5,-0.4, 0.0,
          0.5,-0.4, 0.0,
          0.0,-0.6, 0.0,
          0.0,-0.6, 0.0,
          -0.5,-0.3, 0.0,
          0.5,-0.3, 0.0,
          0.0,-0.8, 0.0,
          0.0,-0.8, 0.0,
          -0.5,-0.2, 0.0,
          0.5,-0.2, 0.0,
          -0.1,0.65, 0.0,
          0.1,0.65, 0.0,
          0.0,0.85, 0.0
        ]);

        var buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, coords, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(a_coords_location);
        gl.vertexAttribPointer(a_coords_location, 3, gl.FLOAT, false, 0, 0);

        var color = new Float32Array([0.8, 0.2, 0.2]);
        gl.uniform3fv(u_color_location, color);

        var shift = 0.0;
        gl.uniform1f(u_shift_location, shift);

        gl.clearColor(0.88, 0.55, 0.65, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        canvas.onmousedown = function () {
          shift += 0.1;
          if (shift > 1.5) {
            shift = -1.5;
          }
          gl.uniform1f(u_shift_location, shift);
          gl.clearColor(0.88, 0.55, 0.65, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
      </script>
    </div>
