<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Solar System (WebGL)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, Arial, sans-serif; color: #fff; }
  canvas { display: block; }
  #title { position: fixed; top: 12px; left: 16px; font-size: 14px; opacity: .85; pointer-events: none; }
  #title small { display: block; opacity: .6; margin-top: 2px; }
  #panel { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 96vw; padding: 8px 10px; background: rgba(15,20,35,.65); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; backdrop-filter: blur(6px); }
  #panel button { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #panel button:hover { background: rgba(255,255,255,.2); }
  #panel button.active { background: #3b7cff; border-color: #3b7cff; }
  #controls { position: fixed; top: 12px; right: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; font-size: 12px; background: rgba(15,20,35,.65); padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); }
  #controls label { display: flex; align-items: center; gap: 8px; }
  #controls button { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .label { position: fixed; left: 0; top: 0; font-size: 11px; color: #cfe3ff; pointer-events: none; text-shadow: 0 0 4px #000; white-space: nowrap; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; font-size: 16px; z-index: 10; }
</style>
</head>
<body>
<div id="loading">Generating planets...</div>
<div id="title">Solar System – WebGL<small>Drag: rotate · Scroll/pinch: zoom · Buttons: focus</small></div>
<div id="controls">
  <label>Speed <input id="speed" type="range" min="0" max="6" step="0.1" value="1"><span id="speedVal">1.0x</span></label>
  <label><input id="showLabels" type="checkbox" checked> Labels</label>
  <label><input id="showOrbits" type="checkbox" checked> Orbits</label>
  <button id="pause">Pause</button>
</div>
<div id="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- Procedural noise (seamless on a sphere) ----------
  function hash(x, y, z) {
    var n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  }
  function sm(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function noise3(x, y, z) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = sm(x - xi), yf = sm(y - yi), zf = sm(z - zi);
    var c = function (a, b, d) { return hash(xi + a, yi + b, zi + d); };
    return lerp(
      lerp(lerp(c(0,0,0), c(1,0,0), xf), lerp(c(0,1,0), c(1,1,0), xf), yf),
      lerp(lerp(c(0,0,1), c(1,0,1), xf), lerp(c(0,1,1), c(1,1,1), xf), yf), zf);
  }
  function fbm(x, y, z, oct) {
    var s = 0, a = 0.5, f = 1;
    for (var i = 0; i < (oct || 5); i++) { s += a * noise3(x * f, y * f, z * f); f *= 2; a *= 0.5; }
    return s / 0.96875;
  }
  function mix(a, b, t) { t = Math.max(0, Math.min(1, t)); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function step(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  // fn(sx, sy, sz, u, v) -> [r,g,b,(a)]   (sx,sy,sz = unit sphere point)
  function makeTexture(w, h, fn) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
    for (var y = 0; y < h; y++) {
      var v = y / h, lat = (v - 0.5) * Math.PI;
      for (var x = 0; x < w; x++) {
        var u = x / w, lon = u * Math.PI * 2;
        var sx = Math.cos(lat) * Math.cos(lon), sy = Math.sin(lat), sz = Math.cos(lat) * Math.sin(lon);
        var col = fn(sx, sy, sz, u, v), i = (y * w + x) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col.length > 3 ? col[3] : 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  // ---------- Textures ----------
  var T = {};
  function buildTextures() {
    // ---- Sun: yellow-white photosphere with orange granulation / sunspots
    T.sun = makeTexture(512, 256, function (x, y, z) {
      var n = fbm(x * 4, y * 4, z * 4, 5);
      var col = mix([255, 150, 30], [255, 235, 160], n * 1.5 - 0.15);
      var spots = step(0.62, 0.75, fbm(x * 2 + 11, y * 2, z * 2, 3));
      return mix(col, [190, 70, 10], spots * 0.6);
    });

    // ---- Mercury: dark grey-brown, cratered
    T.mercury = makeTexture(512, 256, function (x, y, z) {
      var n = fbm(x * 4, y * 4, z * 4, 6), r = Math.abs(fbm(x * 10, y * 10, z * 10, 3) - 0.5) * 2;
      return mix([95, 88, 82], [178, 168, 156], n * 0.9 + r * 0.25);
    });

    // ---- Moon: light grey highlands + dark basalt maria + craters
    T.moon = makeTexture(512, 256, function (x, y, z) {
      var hl = fbm(x * 5, y * 5, z * 5, 5);
      var col = mix([135, 135, 133], [205, 204, 200], hl);
      var maria = step(0.50, 0.62, fbm(x * 1.6 + 5, y * 1.6, z * 1.6, 4));
      col = mix(col, [72, 72, 76], maria * 0.85);
      var c = Math.abs(fbm(x * 14, y * 14, z * 14, 3) - 0.5) * 2;
      return mix(col, [225, 225, 222], step(0.8, 1.0, c) * 0.35);
    });

    // ---- Venus: creamy pale yellow cloud tops
    T.venus = makeTexture(512, 256, function (x, y, z) {
      var n = fbm(x * 2, y * 5, z * 2, 5);
      return mix([214, 176, 108], [248, 232, 190], n * 1.25);
    });

    // ---- Earth: "Blue Marble" look
    T.earth = makeTexture(1024, 512, function (x, y, z, u, v) {
      var e = fbm(x * 2.2 + 3, y * 2.2, z * 2.2, 6);
      var lat = Math.abs(v - 0.5) * 2;                    // 0 equator .. 1 pole
      var col;
      if (e > 0.52) {
        var h = (e - 0.52) * 5;                           // elevation
        var moist = fbm(x * 3 + 20, y * 3, z * 3 + 7, 4);
        var forest = [30, 78, 38], grass = [92, 120, 58], desert = [196, 168, 110], rock = [112, 98, 84];
        col = mix(forest, grass, step(0.35, 0.65, lat + (moist - 0.5) * 0.6));
        // deserts in the subtropics where it is dry
        var dry = step(0.5, 0.35, moist) * step(0.12, 0.3, lat) * step(0.75, 0.45, lat);
        col = mix(col, desert, Math.max(0, Math.min(1, dry)));
        col = mix(col, rock, step(0.25, 0.7, h));
        col = mix(col, [240, 242, 248], step(0.7, 0.95, h));
      } else {
        var depth = step(0.22, 0.52, e);
        col = mix([3, 18, 62], [14, 70, 135], depth);
        col = mix(col, [40, 140, 170], step(0.48, 0.52, e) * 0.8); // shallow coast
      }
      var cap = 0.86 + (fbm(x * 8, y * 8, z * 8, 3) - 0.5) * 0.1;
      return mix(col, [244, 248, 255], step(cap, cap + 0.05, lat));
    });
    T.clouds = makeTexture(1024, 512, function (x, y, z) {
      var c = fbm(x * 3.2 + 9, y * 5, z * 3.2, 6);
      return [255, 255, 255, step(0.5, 0.8, c) * 230];
    });

    // ---- Mars: rusty orange with dark basalt regions and white caps
    T.mars = makeTexture(512, 256, function (x, y, z, u, v) {
      var n = fbm(x * 3, y * 3, z * 3, 6), lat = Math.abs(v - 0.5) * 2;
      var col = mix([150, 72, 42], [208, 126, 78], n * 1.3);
      var dark = step(0.5, 0.65, fbm(x * 2 + 4, y * 2, z * 2, 4));
      col = mix(col, [88, 50, 40], dark * 0.6);
      return mix(col, [248, 245, 240], step(0.9, 0.96, lat));
    });

    // ---- Jupiter: cream / tan / brown belts + Great Red Spot
    T.jupiter = makeTexture(512, 256, function (x, y, z, u, v) {
      var warp = fbm(x * 3, y * 9, z * 3, 5) * 2.2;
      var lat = (v - 0.5) * Math.PI;
      var band = 0.5 + 0.5 * Math.sin(lat * 13 + warp * 2.2);
      var band2 = 0.5 + 0.5 * Math.sin(lat * 27 + warp * 3.5);
      var col = mix([158, 108, 72], [238, 222, 192], band);        // brown belts -> cream zones
      col = mix(col, [205, 160, 115], band2 * 0.35);
      var sx = (u - 0.38) * 9, sy = (v - 0.64) * 16;                // Great Red Spot
      var s = Math.exp(-(sx * sx + sy * sy));
      return mix(col, [186, 82, 54], s * 0.95);
    });

    // ---- Saturn: pale gold, soft bands
    T.saturn = makeTexture(512, 256, function (x, y, z, u, v) {
      var warp = fbm(x * 2, y * 6, z * 2, 4);
      var lat = (v - 0.5) * Math.PI;
      var b = 0.5 + 0.5 * Math.sin(lat * 10 + warp * 1.6);
      return mix([196, 168, 116], [236, 215, 166], b);
    });

    // ---- Uranus: pale cyan ice giant
    T.uranus = makeTexture(512, 256, function (x, y, z, u, v) {
      var n = fbm(x * 2, y * 4, z * 2, 4);
      return mix([150, 215, 225], [186, 238, 240], n * 0.8 + (0.5 - Math.abs(v - 0.5)) * 0.3);
    });

    // ---- Neptune: deep azure with bright cloud streaks and a dark spot
    T.neptune = makeTexture(512, 256, function (x, y, z, u, v) {
      var n = fbm(x * 2.5, y * 7, z * 2.5, 5);
      var col = mix([32, 62, 185], [66, 112, 232], n * 1.3);
      col = mix(col, [190, 215, 255], step(0.72, 0.82, fbm(x * 4 + 7, y * 10, z * 4, 4)) * 0.55);
      var sx = (u - 0.6) * 10, sy = (v - 0.58) * 18;
      return mix(col, [18, 36, 120], Math.exp(-(sx * sx + sy * sy)) * 0.8);
    });
  }

  function glowTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,240,180,1)');
    gr.addColorStop(0.25, 'rgba(255,170,60,0.55)');
    gr.addColorStop(0.6, 'rgba(255,100,20,0.15)');
    gr.addColorStop(1, 'rgba(255,80,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    var gt = new THREE.CanvasTexture(c); gt.encoding = THREE.sRGBEncoding; return gt;
  }

  function ringTexture(stops) {
    var c = document.createElement('canvas'); c.width = 512; c.height = 4;
    var g = c.getContext('2d');
    for (var x = 0; x < 512; x++) {
      var t = x / 512, a = 0, col = '200,180,140';
      for (var i = 0; i < stops.length; i++) if (t >= stops[i][0] && t <= stops[i][1]) { a = stops[i][2]; }
      a *= 0.75 + 0.25 * Math.sin(x * 0.9) * Math.sin(x * 0.23);
      g.fillStyle = 'rgba(' + col + ',' + a + ')'; g.fillRect(x, 0, 1, 4);
    }
    var rt = new THREE.CanvasTexture(c); rt.encoding = THREE.sRGBEncoding; return rt;
  }

  // ---------- Scene ----------
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);

  // Starfield
  (function () {
    var N = 5000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) {
      var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = 1500 + Math.random() * 500, s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(th);
      var b = 0.5 + Math.random() * 0.5, tint = Math.random();
      col[i * 3] = b * (tint > 0.8 ? 1 : 0.85); col[i * 3 + 1] = b * 0.9; col[i * 3 + 2] = b * (tint < 0.3 ? 1 : 0.9);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 2, vertexColors: true, sizeAttenuation: false })));
  })();

  scene.add(new THREE.AmbientLight(0x56607a, 0.6));
  var sunLight = new THREE.PointLight(0xfff4e6, 1.7, 0, 0);
  scene.add(sunLight);

  // Body data  (distance, radius, orbital period in Earth years, spin rad/s, axial tilt deg)
  var DATA = [
    { name: 'Mercury', tex: 'mercury', dist: 18,  r: 1.2, period: 0.241, spin: 0.15,  tilt: 0.03 },
    { name: 'Venus',   tex: 'venus',   dist: 26,  r: 2.0, period: 0.615, spin: -0.08, tilt: 177 },
    { name: 'Earth',   tex: 'earth',   dist: 36,  r: 2.2, period: 1.0,   spin: 1.2,   tilt: 23.4 },
    { name: 'Mars',    tex: 'mars',    dist: 46,  r: 1.5, period: 1.881, spin: 1.15,  tilt: 25.2 },
    { name: 'Jupiter', tex: 'jupiter', dist: 68,  r: 6.0, period: 11.86, spin: 2.6,   tilt: 3.1 },
    { name: 'Saturn',  tex: 'saturn',  dist: 92,  r: 5.0, period: 29.45, spin: 2.4,   tilt: 26.7, ring: true },
    { name: 'Uranus',  tex: 'uranus',  dist: 114, r: 3.2, period: 84.0,  spin: -1.5,  tilt: 97.8 },
    { name: 'Neptune', tex: 'neptune', dist: 132, r: 3.1, period: 164.8, spin: 1.6,   tilt: 28.3 }
  ];
  var EARTH_YEAR_SECONDS = 60;          // at speed 1x one Earth year takes 60 s
  var bodies = [];                      // {name, holder, mesh, data, angle}
  var orbitLines = [];
  var focusables = [];
  var labels = [];

  function addLabel(text, obj3d, yOffsetPx) {
    var el = document.createElement('div'); el.className = 'label'; el.textContent = text;
    document.body.appendChild(el);
    labels.push({ el: el, obj: obj3d, off: yOffsetPx || 8 });
  }

  var sunMesh, moonHolder, moonMesh, cloudMesh, earthBody;

  function build() {
    buildTextures();

    // Sun
    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(10, 64, 48), new THREE.MeshBasicMaterial({ map: T.sun }));
    scene.add(sunMesh);
    var glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    glow.scale.set(48, 48, 1);
    sunMesh.add(glow);
    addLabel('Sun', sunMesh, 40);
    focusables.push({ name: 'Sun', obj: sunMesh, dist: 55 });

    // Planets
    DATA.forEach(function (d, idx) {
      var holder = new THREE.Group();
      var tilt = new THREE.Group();
      tilt.rotation.z = THREE.MathUtils.degToRad(d.tilt);
      var mesh = new THREE.Mesh(
        new THREE.SphereGeometry(d.r, 64, 48),
        new THREE.MeshStandardMaterial({ map: T[d.tex], roughness: 0.9, metalness: 0 })
      );
      tilt.add(mesh);
      holder.add(tilt);
      scene.add(holder);

      if (d.name === 'Earth') {
        cloudMesh = new THREE.Mesh(
          new THREE.SphereGeometry(d.r * 1.015, 64, 48),
          new THREE.MeshStandardMaterial({ map: T.clouds, transparent: true, depthWrite: false, roughness: 1 })
        );
        tilt.add(cloudMesh);
        // atmosphere glow
        var atmo = new THREE.Mesh(
          new THREE.SphereGeometry(d.r * 1.08, 48, 32),
          new THREE.MeshBasicMaterial({ color: 0x5aa8ff, transparent: true, opacity: 0.12, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        tilt.add(atmo);
        earthBody = holder;

        // Moon
        moonHolder = new THREE.Group();
        moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 24), new THREE.MeshStandardMaterial({ map: T.moon, roughness: 1 }));
        moonHolder.add(moonMesh);
        holder.add(moonHolder);
        var mOrb = makeCircle(5.2, 0x666677, 0.35);
        mOrb.rotation.x = THREE.MathUtils.degToRad(5);
        holder.add(mOrb);
        orbitLines.push(mOrb);
        addLabel('Moon', moonMesh, 12);
        focusables.push({ name: 'Moon', obj: moonMesh, dist: 3 });
      }

      if (d.ring) {
        var inner = d.r * 1.35, outer = d.r * 2.35;
        var rg = new THREE.RingGeometry(inner, outer, 128, 1);
        var p = rg.attributes.position, uv = rg.attributes.uv, v3 = new THREE.Vector3();
        for (var i = 0; i < p.count; i++) {
          v3.fromBufferAttribute(p, i);
          uv.setXY(i, (v3.length() - inner) / (outer - inner), 0.5);
        }
        var ringMat = new THREE.MeshBasicMaterial({
          map: ringTexture([[0.0, 0.18, 0.35], [0.2, 0.45, 0.85], [0.47, 0.52, 0.0], [0.53, 0.85, 0.75], [0.88, 0.95, 0.3]]),
          side: THREE.DoubleSide, transparent: true, depthWrite: false
        });
        var ring = new THREE.Mesh(rg, ringMat);
        ring.rotation.x = Math.PI / 2;
        tilt.add(ring);
      }

      var orbit = makeCircle(d.dist, 0x6688bb, 0.28);
      scene.add(orbit);
      orbitLines.push(orbit);

      bodies.push({ data: d, holder: holder, mesh: mesh, angle: Math.random() * Math.PI * 2 });
      addLabel(d.name, holder, d.r * 2.2 + 6);
      focusables.push({ name: d.name, obj: holder, dist: d.r * (d.name === 'Earth' ? 6 : 4.5) + 4 });
    });

    // Buttons
    var panel = document.getElementById('panel');
    focusables.forEach(function (f, i) {
      var b = document.createElement('button'); b.textContent = f.name;
      b.onclick = function () { setFocus(i); };
      f.btn = b; panel.appendChild(b);
    });
    var overview = document.createElement('button'); overview.textContent = 'Overview';
    overview.onclick = function () { setFocus(0, 260); };
    panel.insertBefore(overview, panel.firstChild);

    setFocus(0, 260);
    document.getElementById('loading').style.display = 'none';
  }

  function makeCircle(radius, color, opacity) {
    var pts = [];
    for (var i = 0; i <= 256; i++) { var a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius)); }
    return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity }));
  }

  // ---------- Camera control ----------
  var cam = { theta: 0.6, phi: 1.15, dist: 260, wantDist: 260, target: new THREE.Vector3(), focus: null };
  function setFocus(i, customDist) {
    cam.focus = focusables[i];
    cam.wantDist = customDist || cam.focus.dist;
    focusables.forEach(function (f) { f.btn && f.btn.classList.remove('active'); });
    if (cam.focus.btn && !customDist) cam.focus.btn.classList.add('active');
  }

  var dragging = false, lastX = 0, lastY = 0, pointers = {}, pinchD = 0;
  var cv = renderer.domElement;
  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture(e.pointerId); pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  cv.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD) zoom(pinchD / d);
      pinchD = d; return;
    }
    cam.theta -= (e.clientX - lastX) * 0.005;
    cam.phi = Math.max(0.05, Math.min(Math.PI - 0.05, cam.phi - (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endPtr(e) { delete pointers[e.pointerId]; pinchD = 0; if (!Object.keys(pointers).length) dragging = false; }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  function zoom(f) { cam.wantDist = Math.max(2, Math.min(700, cam.wantDist * f)); }
  cv.addEventListener('wheel', function (e) { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

  // ---------- UI ----------
  var speed = 1, paused = false, showLabels = true;
  var speedEl = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
  speedEl.oninput = function () { speed = parseFloat(speedEl.value); speedVal.textContent = speed.toFixed(1) + 'x'; };
  document.getElementById('pause').onclick = function () { paused = !paused; this.textContent = paused ? 'Play' : 'Pause'; };
  document.getElementById('showLabels').onchange = function () { showLabels = this.checked; };
  document.getElementById('showOrbits').onchange = function () { var s = this.checked; orbitLines.forEach(function (o) { o.visible = s; }); };

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Animation ----------
  var clock = new THREE.Clock(), moonAngle = 0, tmp = new THREE.Vector3();
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var k = paused ? 0 : speed;

    sunMesh.rotation.y += dt * 0.05 * k;
    bodies.forEach(function (b) {
      var d = b.data;
      b.angle += (Math.PI * 2 / (EARTH_YEAR_SECONDS * d.period)) * dt * k;
      b.holder.position.set(Math.cos(b.angle) * d.dist, 0, Math.sin(b.angle) * d.dist);
      b.mesh.rotation.y += d.spin * dt * k;
    });
    if (cloudMesh) cloudMesh.rotation.y += 1.35 * dt * k;
    if (moonHolder) {
      moonAngle += (Math.PI * 2 * 12 / EARTH_YEAR_SECONDS) * dt * k;
      moonHolder.position.set(Math.cos(moonAngle) * 5.2, Math.sin(moonAngle) * 0.45, Math.sin(moonAngle) * 5.2);
      moonMesh.rotation.y = -moonAngle;   // tidally locked
    }

    // camera follow
    if (cam.focus) { cam.focus.obj.getWorldPosition(tmp); cam.target.lerp(tmp, 0.12); }
    cam.dist += (cam.wantDist - cam.dist) * 0.08;
    var sp = Math.sin(cam.phi);
    camera.position.set(
      cam.target.x + cam.dist * sp * Math.sin(cam.theta),
      cam.target.y + cam.dist * Math.cos(cam.phi),
      cam.target.z + cam.dist * sp * Math.cos(cam.theta));
    camera.lookAt(cam.target);

    renderer.render(scene, camera);

    // labels
    var w = window.innerWidth, h = window.innerHeight;
    labels.forEach(function (l) {
      l.obj.getWorldPosition(tmp);
      tmp.project(camera);
      var vis = showLabels && tmp.z < 1 && tmp.z > -1;
      l.el.style.display = vis ? 'block' : 'none';
      if (vis) l.el.style.transform = 'translate(' + ((tmp.x * 0.5 + 0.5) * w) + 'px,' + ((-tmp.y * 0.5 + 0.5) * h + l.off) + 'px) translate(-50%,0)';
    });
  }

  // Build after first paint so the loading message shows
  setTimeout(function () { build(); animate(); }, 30);
})();
</script>
</body>
</html>
